[workspace]
resolver = "2"
members = [
    "crates/turnstone-protocol",
    "crates/turnstone-engine",
    "crates/turnstone-hashindex",
    "crates/turnstone-mlock",
    "crates/turnstone-tls",
    "crates/turnstone-config",
    "crates/turnstone-metrics",
    "crates/turnstone-client",
    "crates/turnstone-cli",
    "crates/turnstone-database",
    "crates/turnstone-repl",
    "crates/turnstone-server",
    "crates/turnstone-backup",
    "crates/turnstone",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/kirubasankars/turnstone"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
prometheus = "0.13"
thiserror = "2.0"
crc32fast = "1.4"
parking_lot = "0.12"
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
rustls-pemfile = "2.2"
clap = { version = "4.5", features = ["derive"] }
criterion = { version = "0.5", features = ["html_reports"] }
